title:  Floris Jousselin
description: Electronics engineer — systems, robotics, mechatronics & machine learning

theme: null

github:
  repository: robotcopper/robotcopper.github.io

readme_index:
  with_frontmatter: true

source              : .
destination         : config/_site
collections_dir     : config
layouts_dir         : config/_layouts
includes_dir        : config/_includes
sass:
  sass_dir: config/_sass
  style: compressed

plugins:
  - jemoji
  - jekyll-avatar
  - jekyll-mentions
  - jekyll-sitemap

exclude:
  - Makefile
  - CNAME
  - LICENSE
  - update.sh
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - node_modules
  - package.json
  - package-lock.json
  - webpack.config.js
  - jekyll-rtd-theme.gemspec
  - .github/

markdown: kramdown
highlighter: rouge
